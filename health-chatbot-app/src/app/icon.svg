<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="healthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#healthGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="44" y="44" width="424" height="424" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4" />

  <!-- Pulse / Activity Waveform + Medical Heart Symbol -->
  <g filter="url(#glow)">
    <!-- Heart Outline Accent -->
    <path d="M 256 135 C 215 85, 130 115, 130 185 C 130 248, 205 305, 256 358 C 307 305, 382 248, 382 185 C 382 115, 297 85, 256 135 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-opacity="0.3" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Activity Wave (Pulse Line) -->
    <path d="M 115 256 L 185 256 L 210 200 L 240 325 L 272 155 L 302 285 L 322 256 L 397 256" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
