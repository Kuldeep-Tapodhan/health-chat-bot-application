services:
  # FastAPI Backend Service (Using SQLite)
  backend:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: health_ai_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    env_file:
      - ./backend_fastapi/.env
    environment:
      DATABASE_URL: ""
    volumes:
      - chroma_db_data:/app/chroma_db
      - sqlite_db_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Next.js Frontend Service
  frontend:
    build:
      context: ./health-chatbot-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    container_name: health_ai_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3003}:3003"
    env_file:
      - ./health-chatbot-app/.env
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_db_data:
    driver: local
  sqlite_db_data:
    driver: local
