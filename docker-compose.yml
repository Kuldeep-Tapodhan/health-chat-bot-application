services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: health_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-health_db}
      POSTGRES_USER: ${POSTGRES_USER:-health_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health_user} -d ${POSTGRES_DB:-health_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: health_ai_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    env_file:
      - ./backend_fastapi/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-health_user}:${POSTGRES_PASSWORD:-health_pass}@postgres:5432/${POSTGRES_DB:-health_db}}
    volumes:
      - chroma_db_data:/app/chroma_db
      - sqlite_db_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Frontend Service
  frontend:
    build:
      context: ./health-chatbot-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://169.58.108.90:8001}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    container_name: health_ai_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3003}:3003"
    env_file:
      - ./health-chatbot-app/.env
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_db_data:
    driver: local
  sqlite_db_data:
    driver: local
  postgres_data:
    driver: local
